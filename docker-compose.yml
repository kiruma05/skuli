# Unified stack: frontend (Next.js) + backend (Spring Boot) + Postgres.
# Everything runs in containers — no host Java/Maven/Node needed.
# Keycloak runs in its OWN separate container (not defined here); services reach it via issuer URLs.
#
#   Frontend : http://localhost:3000
#   Backend  : http://localhost:8081  (health: /actuator/health)
#   Postgres : localhost:5433         (inside the network: postgres:5432)
#
# Bring up:  docker compose up -d --build

services:
  postgres:
    image: postgres:15
    container_name: skuli_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-kiruma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-mydb}
    ports:
      # Host 5433 to avoid clashing with any existing Postgres on 5432.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-kiruma} -d ${DB_NAME:-mydb}']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./school-platform
    container_name: skuli_backend
    ports:
      # Host 8081 to avoid clashing with the external Keycloak container on 8080.
      - '8081:8080'
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ${DB_NAME:-mydb}
      DB_USER: ${DB_USER:-kiruma}
      DB_PASSWORD: ${DB_PASSWORD:-mypassword}
      # External Keycloak container, realm "skuli". JWT decoding is lazy, so the backend
      # boots even if Keycloak is not reachable yet.
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://host.docker.internal:8080/realms/skuli}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./full-stack-school-main
      args:
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-demo}
    container_name: skuli_frontend
    ports:
      # Fully containerized: the app IS localhost:3000 (host dev server retired).
      - '3000:3000'
    env_file:
      - ./full-stack-school-main/.env
    environment:
      # Override the .env's localhost DB URL so the container reaches the compose Postgres.
      # (Runs `prisma migrate deploy` on startup, creating the schema on a fresh DB.)
      DATABASE_URL: postgresql://${DB_USER:-kiruma}:${DB_PASSWORD:-mypassword}@postgres:5432/${DB_NAME:-mydb}
      # OIDC-in-Docker: use one Keycloak hostname reachable from BOTH the container (host-gateway)
      # and the browser (needs `127.0.0.1 host.docker.internal` in the host's /etc/hosts).
      AUTH_KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER_URI:-http://host.docker.internal:8080/realms/skuli}
      AUTH_TRUST_HOST: 'true'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
