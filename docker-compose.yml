# Base stack: shared infrastructure only (Postgres + volume).
# Compose project name is pinned to "skuli" so every overlay combination lands in
# the SAME project -> same network (skuli_default) + same volume (skuli_postgres_data).
#
# This base is meant to be combined with per-app overlays:
#   Backend  : docker compose -f docker-compose.yml -f docker-compose.backend.yml  up -d --build
#   Frontend : docker compose -f docker-compose.yml -f docker-compose.frontend.yml up -d --build
#   Both     : add both -f overlays (or set COMPOSE_FILE in .env)
#
# Keycloak runs in its OWN separate container (not defined here); services reach it via issuer URLs.
#
#   Frontend : http://localhost:3000
#   Backend  : http://localhost:8081  (health: /actuator/health)
#   Postgres : localhost:5433         (inside the network: postgres:5432)

name: skuli

services:
  postgres:
    image: postgres:15
    container_name: skuli_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-kiruma}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_NAME:-mydb}
    ports:
      # Host 5433 to avoid clashing with any existing Postgres on 5432.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-kiruma} -d ${DB_NAME:-mydb}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
