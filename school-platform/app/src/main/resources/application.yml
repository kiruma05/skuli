spring:
  application:
    name: school-platform

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mydb}
    username: ${DB_USER:kiruma}
    password: ${DB_PASSWORD:mypassword}

  jpa:
    hibernate:
      # Schema is owned by Flyway; Hibernate only validates against it (from Phase 2).
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Schema owned by Flyway; V1__init.sql (Phase 2) is the translated Prisma schema + tenant_id.
    enabled: true

# Keycloak (separate container). Read via a custom property so the JWT decoder can be lazy
# (see SecurityConfig) and the app boots before Keycloak/its realm is ready.
keycloak:
  issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/skuli}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080
