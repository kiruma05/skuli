# Frontend overlay (Next.js). Combine with the base:
#   docker compose -f docker-compose.yml -f docker-compose.frontend.yml up -d --build
# The base supplies Postgres + the shared network; this file adds only the frontend service.

name: skuli

services:
  frontend:
    build:
      context: ./full-stack-school-main
      args:
        NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: ${NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME:-demo}
    container_name: skuli_frontend
    ports:
      # Fully containerized: the app IS localhost:3000 (host dev server retired).
      - '3000:3000'
    env_file:
      - ./full-stack-school-main/.env
    environment:
      # Override the .env's localhost DB URL so the container reaches the compose Postgres.
      # (Runs `prisma migrate deploy` on startup, creating the schema on a fresh DB.)
      DATABASE_URL: postgresql://${DB_USER:-kiruma}:${DB_PASSWORD:-mypassword}@postgres:5432/${DB_NAME:-mydb}
      # OIDC-in-Docker: use one Keycloak hostname reachable from BOTH the container (host-gateway)
      # and the browser (needs `127.0.0.1 host.docker.internal` in the host's /etc/hosts).
      AUTH_KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER_URI:-http://host.docker.internal:8080/realms/skuli}
      AUTH_TRUST_HOST: 'true'
      # Server-side calls to the Spring backend (Phase 4 cutover). The backend service is on the
      # same compose network, so reach it by service name (bring up the backend overlay too).
      API_BASE_URL: ${API_BASE_URL:-http://backend:8080}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
